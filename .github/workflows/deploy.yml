name: Build és publikálás GitHub Pages-re

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Függőségek telepítése
        run: npm ci

      - name: GitHub Pages beállítás felderítése
        id: pages
        uses: actions/configure-pages@v5

      - name: Alap-útvonal meghatározása
        id: basepath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" = "${OWNER_LOWER}.github.io" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Astro build
        env:
          BASE_PATH: ${{ steps.basepath.outputs.base_path }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Build feltöltése Pages artifactként
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikálás GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4